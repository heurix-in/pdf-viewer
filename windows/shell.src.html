<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__HASH__'; style-src 'unsafe-inline'; img-src data:; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Heurix PDF Viewer</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__FAVICON__">
<style>
:root{--ink:#1c1428;--ink-soft:#3b3049;--muted:#6d6579;--violet:#5b21b6;--violet-2:#7c3aed;--wash:#f1eafd;--wash-2:#e5d8fb;--mustard:#d4a72c;--line:#d5c8e6;--desk:#e7e2ee;--paper:#f6f3fa;
  --font:"Bricolage Grotesque","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);overflow:hidden}
.app{display:grid;grid-template-rows:40px minmax(0,1fr);height:100%}
.strip{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--desk);border-bottom:1px solid var(--line);min-width:0}
.tabs{display:flex;align-items:flex-end;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;flex:0 1 210px;min-width:92px;max-width:230px;height:34px;padding:0 6px 0 11px;border:0;border-radius:10px 10px 0 0;background:transparent;color:var(--muted);font:600 13px/1 var(--font);text-align:left;cursor:default;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:rgba(255,255,255,.55);color:var(--ink-soft)}
.tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 -1px 0 var(--line),-1px 0 0 var(--line),1px 0 0 var(--line)}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:8px;right:8px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--violet)}
.tab:focus-visible{outline:2px solid var(--violet-2);outline-offset:-2px}
.tab .ico{flex:none;width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.tab .dot{flex:none;width:8px;height:8px;margin:0 3.5px;border-radius:50%;background:var(--mustard);box-shadow:0 0 0 2px rgba(212,167,44,.25)}
.tab .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tab .x{flex:none;display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:7px;background:transparent;color:inherit;opacity:.55;cursor:default}
.tab .x svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.tab:hover .x,.tab[aria-selected="true"] .x{opacity:.9}
.tab .x:hover{background:var(--wash-2);color:var(--violet);opacity:1}
.tab.enter{animation:tabIn .18s var(--ease)}
@keyframes tabIn{from{flex-basis:40px;opacity:0}to{opacity:1}}
.plus{flex:none;display:grid;place-items:center;width:30px;height:30px;margin:0 0 2px 4px;border:0;border-radius:9px;background:transparent;color:var(--ink-soft);cursor:default}
.plus:hover{background:rgba(255,255,255,.7);color:var(--violet)}
.plus:focus-visible{outline:2px solid var(--violet-2)}
.plus svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.stage{position:relative;min-height:0;background:#fff}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;pointer-events:none}   /* kept laid out so each tab keeps its scroll position and zoom */
.frame.on{visibility:visible;pointer-events:auto}
body.drag .stage::after{content:"Drop PDFs to open them in new tabs";position:absolute;inset:10px;display:grid;place-items:center;border:2px dashed var(--violet-2);border-radius:18px;background:rgba(241,234,253,.88);color:var(--violet);font:700 18px var(--font);z-index:5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tab.enter{animation:none}.tab{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="strip" id="strip">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open documents"></div>
    <button class="plus" id="plus" type="button" title="Open another PDF in a new tab (Ctrl+T)" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const tabsEl = $('tabs'), stage = $('stage');
  const NS = 'http://www.w3.org/2000/svg';
  const tabs = []; let active = null, seq = 0;

  const isBlank = (t) => !t.name && !t.pending;
  const post = (t, msg) => { try { t.frame.contentWindow.postMessage(msg, location.origin); return true; } catch (e) { return false; } };
  const svg = (d) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.append(p); return s; };

  function label(t) { return t.name || 'New tab'; }

  function render() {
    tabsEl.replaceChildren(...tabs.map((t) => {
      const b = document.createElement('div');
      b.className = 'tab' + (t.fresh ? ' enter' : ''); t.fresh = false;
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', t === active); b.tabIndex = t === active ? 0 : -1;
      b.title = label(t) + (t.dirty ? ' (unsaved changes)' : '');
      b.dataset.id = t.id;
      if (t.dirty) { const d = document.createElement('span'); d.className = 'dot'; b.append(d); }
      else { const i = svg('M6 3.5h8l4.5 4.5v12.5H6zM14 3.5V8h4.5'); i.setAttribute('class', 'ico'); b.append(i); }
      const l = document.createElement('span'); l.className = 'label'; l.textContent = label(t); b.append(l);
      const x = document.createElement('button'); x.className = 'x'; x.type = 'button'; x.tabIndex = -1; x.title = 'Close tab'; x.setAttribute('aria-label', 'Close ' + label(t));
      x.append(svg('M6 6l12 12M18 6 6 18')); b.append(x);
      x.addEventListener('click', (e) => { e.stopPropagation(); closeTab(t); });
      b.addEventListener('click', () => select(t));
      b.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); closeTab(t); } });
      b.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
      b.addEventListener('keydown', (e) => {
        const i = tabs.indexOf(t);
        if (e.key === 'ArrowRight') { e.preventDefault(); select(tabs[(i + 1) % tabs.length], true); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); select(tabs[(i - 1 + tabs.length) % tabs.length], true); }
        else if (e.key === 'Delete') { e.preventDefault(); closeTab(t); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(t); }
      });
      return b;
    }));
    const on = tabsEl.querySelector('[aria-selected="true"]'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    document.title = (active && active.name ? active.name + ' — ' : '') + 'Heurix PDF Viewer';
  }

  function select(t, keepFocus) {
    if (!t) return;
    active = t;
    for (const x of tabs) x.frame.classList.toggle('on', x === t);
    render();
    if (keepFocus) { const el = tabsEl.querySelector('[aria-selected="true"]'); if (el) el.focus(); }
    else { t.frame.focus(); post(t, { hx: 'focus' }); }
  }

  function addTab(opts = {}) {
    const frame = document.createElement('iframe');
    frame.className = 'frame'; frame.src = '/viewer'; frame.title = 'Document';
    frame.setAttribute('allow', 'fullscreen; clipboard-read; clipboard-write'); frame.allowFullscreen = true;
    stage.append(frame);
    const t = { id: ++seq, frame, name: '', key: opts.key || null, dirty: false, ready: false, pending: false, queued: null, fresh: true };
    tabs.push(t);
    if (opts.open) sendOpen(t, opts.open);
    select(t);
    return t;
  }

  function sendOpen(t, payload) {
    t.pending = true; clearTimeout(t.pt); t.pt = setTimeout(() => { t.pending = false; }, 12000);
    if (t.ready) post(t, Object.assign({ hx: 'open' }, payload)); else t.queued = payload;
  }

  function removeTab(t) {
    const i = tabs.indexOf(t); if (i < 0) return;
    tabs.splice(i, 1); t.frame.remove();
    if (!tabs.length) { addTab(); return; }
    if (active === t) select(tabs[Math.min(i, tabs.length - 1)]); else render();
  }

  function closeTab(t) {
    if (!t.ready || !t.name) { removeTab(t); return; }
    if (t !== active) select(t);
    post(t, { hx: 'requestclose' });
  }

  function step(n) { if (tabs.length < 2) return; select(tabs[(tabs.indexOf(active) + n + tabs.length) % tabs.length]); }

  // A new file arrived from Windows ("Open with") or from inside a tab.
  function openIncoming(m) {
    const payload = m.token ? { token: m.token, name: m.name } : m.handle ? { handle: m.handle } : m.file ? { file: m.file } : null;
    if (!payload) return;
    if (m.key) {
      const same = tabs.find((t) => t.key === m.key && t.name);
      if (same) { select(same); return; }
    }
    const blank = tabs.find(isBlank);
    if (blank) { blank.key = m.key || null; sendOpen(blank, payload); select(blank); }
    else addTab({ open: payload, key: m.key || null });
  }

  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    const t = tabs.find((x) => x.frame.contentWindow === e.source); if (!t) return;
    const m = e.data; if (!m || typeof m !== 'object') return;
    switch (m.hx) {
      case 'ready': t.ready = true; if (t.queued) { post(t, Object.assign({ hx: 'open' }, t.queued)); t.queued = null; } break;
      case 'state':
        t.name = m.name || ''; t.dirty = !!m.dirty; if (t.name) { t.pending = false; clearTimeout(t.pt); } else if (!t.pending) t.key = null;
        render(); break;
      case 'open': {
        const p = m.token ? { token: m.token, name: m.name } : m.handle ? { handle: m.handle } : m.file ? { file: m.file } : null;
        if (p) addTab({ open: p });
        break;
      }
      case 'closeresult': if (m.ok) removeTab(t); break;
      case 'key':
        if (m.k === 'next') step(1); else if (m.k === 'prev') step(-1); else if (m.k === 'new') addTab();
        break;
    }
  });

  $('plus').addEventListener('click', () => addTab());
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    else if (e.ctrlKey && !e.altKey && e.key.toLowerCase() === 't') { e.preventDefault(); addTab(); }
  });

  // Drop PDFs on the tab strip: each opens in its own tab.
  const strip = $('strip');
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  strip.addEventListener('dragover', (e) => { if (hasFiles(e)) { e.preventDefault(); document.body.classList.add('drag'); } });
  strip.addEventListener('dragleave', () => document.body.classList.remove('drag'));
  strip.addEventListener('drop', (e) => {
    document.body.classList.remove('drag');
    if (!hasFiles(e)) return; e.preventDefault();
    for (const f of e.dataTransfer.files) if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') openIncoming({ file: f });
  });

  window.addEventListener('beforeunload', (e) => { if (tabs.some((t) => t.dirty)) { e.preventDefault(); e.returnValue = ''; } });

  // The launcher pushes files here (Explorer "Open with" while the viewer is already running).
  let started = false;
  const start = () => { if (!started) { started = true; if (!tabs.length) addTab(); } };
  try {
    const es = new EventSource('/__events');
    es.onmessage = (e) => { try { openIncoming(JSON.parse(e.data)); } catch (_) { /* ignore */ } started = true; };
    es.onopen = () => setTimeout(start, 200);
  } catch (_) { /* no launcher */ }
  setTimeout(start, 1500);
})();
</script>
</body>
</html>
